name: Build Windows + 内置 WebView2（固定版本，普通版的另一档）

# 为什么要单独一档（#36）：企业版 / Server 版 Windows 不带 WebView2 runtime，而且常常装不上
# （没有商店、没有联网权限、组策略拦着）。默认那条 build.yml 走的是 Tauri 的
# `downloadBootstrapper`（装的时候联网现下）⇒ 那种机器上"安装包跑起来了但窗口是空的"。
# 这一档把 **固定版本的 runtime 打进安装包里**（Tauri 的 `fixedRuntime`，安装包大约 +180 MB）。
#
# 触发条件（2026-09-28 改）：**tag `v*` 自动打 + 仍可手动打**；两个架构每次都打（与默认档同构）。
# 原来刻意只挂 workflow_dispatch（怕影响其他打包），但发版那份产物必须"打 tag 就自动出"才成立 ——
# 否则这一档永远靠人记得点一下，而忘了点没有任何人会报红（本仓对这类"靠人回头做"的判断已经吃过多次）。
# 刻意**仍不挂在普通 push / PR 上**：这一档是双架构 × 固定 runtime 解包，跑一次比默认档贵得多，
# 而它在开发推送上没有新信息（默认档 build.yml 已经在每个 push 上出 x64 + arm64）。
# 现有那三条打包与 verify.yml 一行没改 ⇒ 普通推送的 CI 结论不受这条流水线影响。
#
# ⚠️ 两条今天没被任何机器证明过的东西，别读成"已验证可用"：
#   ① 解出来的文件夹名必须正好是 `Microsoft.WebView2.FixedVersionRuntime.<版本>.<架构>`——
#      下面有一步断言会拦（拦不住就说明归档改名了）；但
#   ② **"装到一台没有 WebView2 的 Windows 上真的能打开"这件事，CI 判不了**（CI 的 runner 自带 runtime），
#      那一格仍是人工/真机项。这个文件跑绿只说明"包打出来了、里面塞进去东西了"。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      webview2_version:
        description: "固定版本 runtime 的版本号（归档 release 的 tag）"
        required: true
        default: "133.0.3065.92"
permissions:
  contents: read

jobs:
  build-windows-fixed-webview2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: aarch64-pc-windows-msvc
            label: arm64
    runs-on: windows-latest
    # 这里**不能**写 job 级 `if:` 去引用 `matrix.label`：Actions 的 job 级条件在矩阵展开之前求值，
    # 看不到 matrix 上下文 ⇒ 整个文件被判 Invalid workflow file（表现为"一条都没有的失败运行"，
    # 而不是某一步红）。这个文件从建立起就一直带着这条 ⇒ 18 次运行全红、且从未产生过任何产物。
    # 结果就是与默认档 `build.yml` 同构：两个架构都打，谁触发都一样。
    env:
      WV2_VER: ${{ github.event.inputs.webview2_version || '133.0.3065.92' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # 固定版本 runtime 的 .cab 微软只给页面里的手动链接，CI 里没法"点一下"。
      # 这里用社区归档（clash-verge-rev 用的就是它）—— 它把每个固定版本原样发布成
      # `Microsoft.WebView2.FixedVersionRuntime.<ver>.<arch>.cab`。
      - name: Download and extract the fixed WebView2 runtime
        shell: pwsh
        run: |
          # 版本串来自 workflow_dispatch 的输入，而下面 `cmd /c "expand ..."` 会再过一次 cmd.exe
          # ⇒ 一个 & 就是命令注入。先按四段数字白名单卡死，不合规直接停（这条流水线只有
          #    仓库协作者能手动触发，但不因此放松）。
          if ($env:WV2_VER -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "webview2_version 不是 x.y.z.w 四段数字：`"$env:WV2_VER`""
            exit 1
          }
          $cab = "Microsoft.WebView2.FixedVersionRuntime.$env:WV2_VER.$($env:WV2_ARCH).cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$env:WV2_VER/$cab"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile $cab
          # Windows 自带的 expand.exe 才认 .cab（Expand-Archive 只认 zip）
          cmd /c "expand -F:* $cab src-tauri"
          $dir = "src-tauri/Microsoft.WebView2.FixedVersionRuntime.$env:WV2_VER.$($env:WV2_ARCH)"
          if (-not (Test-Path $dir)) {
            Write-Error "解出来的目录不存在：$dir ⇒ 归档换了命名/结构，配置里的 path 会对不上。现有文件：`n$(Get-ChildItem src-tauri -Directory | Select-Object -ExpandProperty Name)"
            exit 1
          }
          $n = (Get-ChildItem $dir -Recurse -File | Measure-Object).Count
          if ($n -lt 10) { Write-Error "目录里只有 $n 个文件 ⇒ 解压不完整"; exit 1 }
          Write-Host "runtime 就位：$dir（$n 个文件）"
        env:
          WV2_ARCH: ${{ matrix.label }}

      - name: Build installer with the runtime embedded
        shell: pwsh
        run: |
          # `--config` 吃一份内联 JSON，Tauri 会把它**合并**到 tauri.conf.json 之上。
          # 选它而不是学参考项目改名成 tauri.windows.conf.json：那个文件是平台级自动覆盖，
          # 落进仓库就会同时改掉普通档（build.yml）的打包结果 —— 正好是要避免的串味。
          # 字段名核自 tauri-utils 的 WebviewInstallMode（tag = "type"，camelCase，
          # deny_unknown_fields）⇒ 只能是 {"type":"fixedRuntime","path":...}，写错一个字母 CI 直接报错。
          $ov = @{
            bundle = @{
              windows = @{
                webviewInstallMode = @{
                  type = "fixedRuntime"
                  path = "./Microsoft.WebView2.FixedVersionRuntime.$env:WV2_VER.$($env:WV2_ARCH)/"
                }
              }
            }
          } | ConvertTo-Json -Compress -Depth 6
          Write-Host "覆盖配置：$ov"
          # --features bluetooth 不能少（理由同 build.yml：漏了就是没有蓝牙，而构建照样成功）
          npm run tauri -- build --features bluetooth --bundles nsis --target $env:TARGET --config $ov
        env:
          TARGET: ${{ matrix.target }}
          WV2_ARCH: ${{ matrix.label }}

      - name: Verify the installer really contains Bluetooth
        shell: pwsh
        # 同 build.yml 那条旁证：这条流水线是复制出来的，别把那道护栏抄漏
        run: |
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          if ($lock -notmatch '(?m)^name = "btleplug"') {
            Write-Error "Cargo.lock 里没有 btleplug ⇒ 这个包没有蓝牙"
            exit 1
          }

      - name: Report installer size（内置 runtime 那一档应该明显更大）
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis/*.exe" | ForEach-Object {
            Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # 名字与 build.yml 的 gosslan-windows-<arch> 刻意错开 ⇒ 两边产物不会互相覆盖
          name: gosslan-windows-${{ matrix.label }}-webview2-bundled
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ★ 这一档以前只 upload-artifact、从不挂 Release ⇒ Release 的下载列表里永远看不见"内置 WebView2"那个包，
  #   产物只在 Actions 里活着（会过期）。2026-09-30 决定挂上：需要这一档的人正是装不上 WebView2 运行时的人，
  #   藏在 artifact 里等于没有。附件名自带 webview2-bundled ⇒ 与默认档一眼可分，不会拿错。
  #   发布逻辑仍然只在 scripts/publish-release-assets.sh 那一处（这里是第四个消费者，不是第二份实现）。
  release:
    name: 挂到 GitHub Release（与默认档同一个 Release，附件名不冲突）
    needs: build-windows-fixed-webview2
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出发布脚本（发布逻辑只在 scripts/ 那一处）
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-release-assets.sh
          fetch-depth: 1
      - name: 取回本次构建的产物（只取本 run 的两档 webview2 包）
        uses: actions/download-artifact@v4
        with:
          pattern: gosslan-windows-*-webview2-bundled
          merge-multiple: true
          path: assets
      - name: 挂到 Release（创建幂等 + 上传退避重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release-assets.sh --assets assets
