name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 这一步的守卫清单里含 `check-change-budget.mjs`（scripts/build-android-releases.sh），
# 而它在 push 事件上要判的范围是 `github.event.before..github.sha` —— 该变量**不是** Actions
# 默认提供的，不映射就只能退到 `HEAD~1..HEAD`（判的不是"本次推送"）。
# 这里**不开** `GOSSLAN_BUDGET_STRICT`：出包不该因为门禁判不到范围而被打断，
# 那个硬失败属于 verify.yml。
env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # ⚠️ 必须显式覆盖 `packages` —— 这个 action 的默认值是 `'tools platform-tools'`，
          # 而 **Google 已于 2026-09-15 把 `tools` 包从 SDK 仓库下架**：
          # 实测拉 https://dl.google.com/android/repository/repository2-3.xml（415KB），
          # 里面已无 `tools` 路径（`platform-tools` / `cmdline-tools;latest` /
          # `platforms;android-36` / `build-tools;36.0.0` / `ndk;27.1.12297006` 都还在）。
          # 于是 sdkmanager 报 "Warning: Failed to find package 'tools'" 后 exit 1，
          # 本步骤约 9 秒即失败、后面全部步骤被跳过 —— 就是 2026-09-16 起 Android 打包红掉的原因
          # （最后一次成功是 09-14，中间本仓库与 workflow 均无改动，纯外部变更）。
          # 上游同类报告：android-actions/setup-android#537（2026-09-15 开出）。
          # ⚠️ 升级到 @v4 **不能**替代这一行：v4 的默认值同样是 `'tools platform-tools'`。
          packages: 'platform-tools'

      - name: Install SDK platform + build-tools + NDK
        # 版本必须跟 `tauri android init` 生成的工程对得上：那份 build.gradle.kts 里是
        # `compileSdk = 36`（Tauri v2 当前模板），所以必须装 platform 36 —— 只装 34 会直接
        # 停在 "Failed to find target with hash string 'android-36'"。NDK 取本机验证过的 27.1。
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set NDK env
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # 只编要发布的两个 ABI：**最新** arm64-v8a + **稍老** armeabi-v7a。
          # x86/x86_64 只对模拟器有意义，不发布（也省一半 CI 时间）。
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Init Android project
        run: npm run android:init

      # 权限清单 / 竖屏锁定 / release 签名（无 keystore 时回退 debug 签名，保证能安装）
      # 都由 `scripts/inject-android-signing.mjs` 在构建前统一注入 —— 这里不再单独写一份
      # python 注入逻辑，避免两处规则各说各话。
      # `android:init` 会重新生成 gen/android，所以这一步必须在 init 之后、build 之前。

      - name: Build release APK（按 ABI 各出一份）
        # 用仓库脚本而不是 Gradle 的 splits：Tauri 会给每个 ABI 设 ndk.abiFilters，
        # AGP 禁止它与 splits.abi 并存（见脚本头部注释）。脚本对每个 ABI 各构建一次，
        # 天然只有那一个 ABI 的 .so 进包，并落到 release-artifacts/android/。
        # 脚本还会校验签名与 ABI（未签名的 APK 手机上装不上，宁可在 CI 里红掉）。
        run: bash scripts/build-android-releases.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-android-abis
          path: |
            release-artifacts/android/*.apk
            release-artifacts/android/*.sha256

  # 一个 workflow 一个收尾发布 job：所有 matrix 腿打完包、产物也上传成功之后，
  # 由这**唯一一条**任务把文件挂到 Release 上。
  #
  # 为什么必须这样（2026-09-30 在 v4.31.37 上实测到）：原来是每条 matrix 腿各自调
  # `softprops/action-gh-release`，于是同一个 tag 上有多条腿并发"创建/更新同一个 Release"。
  # 那一版 Windows x64 那条腿**构建、蓝牙 feature 旁证、上传产物三步全成功**，
  # 只红在"挂发布页"那一步，而同一次 run 的 arm64 腿成功 ⇒ Release 少一份安装包，
  # 而且是**概率性**少（同批 mac 两腿与 Android 恰好都抢赢了）。
  #
  # 现在：① 每个 workflow 只发一次；② "Release 已存在"走查询而不是并发创建；
  # ③ 挂文件带退避重试（并发窗口是秒级）；④ 任何一次真失败仍然 exit 1 ——
  #    绝不加 `continue-on-error`：把发布失败静音，比少一份产物危险得多（§十五）。
  release:
    name: 挂到 GitHub Release（单一任务·带重试）
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出发布脚本（发布逻辑只在 scripts/ 那一处）
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-release-assets.sh
          fetch-depth: 1
      - name: 取回本次构建的产物
        uses: actions/download-artifact@v4
        with:
          pattern: gosslan-android-abis
          merge-multiple: true
          path: assets
      # ★ 发布逻辑不在这里抄第三份：三份内联 shell 是同一件事的三个家（2026-09-30 那条并发红
      # 就是这样被复制三遍的）。唯一的一份在 `scripts/publish-release-assets.sh`，
      # 它的七种结局由 `scripts/publishRelease.test.ts` 用假 `gh` 在本地判（不需要凭据）。
      - name: 挂到 Release（创建幂等 + 上传退避重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release-assets.sh --assets assets --label base
