name: Build Windows (x64 + ARM64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # 两个架构：**最新**（Windows on ARM）+ **稍老/主流**（Intel & AMD 的 x64）。
    # 不发 i686（32 位）：Windows 11 没有 32 位版本，32 位整机份额已可忽略。
    # ⚠️ NSIS 安装包没有 universal 的概念（不像 macOS 的 .app）——按架构各出一个是惯例
    # （VS Code / Chrome / Firefox 的 Windows 下载页都是这么列）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: aarch64-pc-windows-msvc
            label: arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows (x64 + ARM64) installer (NSIS)
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-windows-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          generate_release_notes: true
