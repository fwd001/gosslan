name: Build macOS (arm64 + x86_64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # **分架构出两份**，不打 universal：universal 把两份二进制拼进一个 .app，体积翻倍，
    # 而用户只可能用到其中一份（Apple 芯片 / Intel 二选一）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x86_64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build .app + .dmg (${{ matrix.label }})
        # ★ 为什么这里要重试而不是直接跑一条：`bundle_dmg.sh`（hdiutil attach + Finder 排版）在
        #   macOS runner 上是**已知会偶发失败**的一步。2026-09-30 实测：同一个 `x86_64` 腿
        #   11:17 那趟（v4.31.41）绿、12:23 这趟（main）红，两次输入一字未变（那次提交没动应用码也没动
        #   这份文件），日志里 vite build ✅、cargo 4m40s ✅、`Built application` ✅、`Bundling Gosslan.app` ✅，
        #   只有 `Running bundle_dmg.sh` 之后 exit 1。
        #   偶发的正确处置是**有界重试**，绝不是 `continue-on-error` —— 那会把"Release 少一档安装包"
        #   静音成绿（v4.31.37 就是这么丢的 Windows x64）。三次仍失败 ⇒ 判红，不装成功。
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rel="src-tauri/target/$TARGET/release"
          dmg_dir="$rel/bundle/dmg"
          attempt=0
          while :; do
            if npm run tauri -- build --target "$TARGET" --features bluetooth; then
              break
            fi
            attempt=$((attempt + 1))
            # 只重试"二进制都编出来了、只有打包那一步挂"这一种形状：编译错、依赖缺、
            # 配置错重试三次只是拖慢红灯。
            if [ ! -x "$rel/gosslan" ]; then
              echo "第 $attempt 次失败且 $rel/gosslan 没产出 ⇒ 编译/链接问题，不是打包偶发，不重试" >&2
              exit 1
            fi
            if ls "$dmg_dir"/*.dmg >/dev/null 2>&1; then
              echo "第 $attempt 次失败但 .dmg 已经在 ⇒ 挂在打包之后那一步，重试没有意义" >&2
              exit 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "连试 $attempt 次都没打出 $TARGET 的 .dmg ⇒ 不再当偶发处理，判红" >&2
              exit 1
            fi
            echo "第 $attempt 次：.app 已出、.dmg 没出 ⇒ 20s 后重试整步（cargo 有缓存，主要重跑打包）"
            sleep 20
          done
          ls -l "$dmg_dir"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosslan-macos-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 一个 workflow 一个收尾发布 job：所有 matrix 腿打完包、产物也上传成功之后，
  # 由这**唯一一条**任务把文件挂到 Release 上。
  #
  # 为什么必须这样（2026-09-30 在 v4.31.37 上实测到）：原来是每条 matrix 腿各自调
  # `softprops/action-gh-release`，于是同一个 tag 上有多条腿并发"创建/更新同一个 Release"。
  # 那一版 Windows x64 那条腿**构建、蓝牙 feature 旁证、上传产物三步全成功**，
  # 只红在"挂发布页"那一步，而同一次 run 的 arm64 腿成功 ⇒ Release 少一份安装包，
  # 而且是**概率性**少（同批 mac 两腿与 Android 恰好都抢赢了）。
  #
  # 现在：① 每个 workflow 只发一次；② "Release 已存在"走查询而不是并发创建；
  # ③ 挂文件带退避重试（并发窗口是秒级）；④ 任何一次真失败仍然 exit 1 ——
  #    绝不加 `continue-on-error`：把发布失败静音，比少一份产物危险得多（§十五）。
  release:
    name: 挂到 GitHub Release（单一任务·带重试）
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出发布脚本（发布逻辑只在 scripts/ 那一处）
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish-release-assets.sh
          fetch-depth: 1
      - name: 取回本次构建的产物
        uses: actions/download-artifact@v4
        with:
          pattern: gosslan-macos-*
          merge-multiple: true
          path: assets
      # ★ 发布逻辑不在这里抄第三份：三份内联 shell 是同一件事的三个家（2026-09-30 那条并发红
      # 就是这样被复制三遍的）。唯一的一份在 `scripts/publish-release-assets.sh`，
      # 它的七种结局由 `scripts/publishRelease.test.ts` 用假 `gh` 在本地判（不需要凭据）。
      - name: 挂到 Release（创建幂等 + 上传退避重试）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release-assets.sh --assets assets --label base
