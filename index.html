<!doctype html>
<html lang="zh-CN" data-title-zh="相闻" data-title-en="Gosslan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gosslan</title>
    <!-- ⚠️ 下面两个占位由 vite.config.ts 的 `gosslan:inline-boot` 插件替换成**内联**内容：
         ① src/boot/theme-boot.js —— 亮暗/主色/语言的首帧决策（必须早于样式与模块脚本）；
         ② src/boot/skeleton.css  —— 首屏骨架的关键样式。
         三个窗口（主 / 设置 / 日志）共用同一份，改一处三处同时生效。 -->
    <!-- GOSSLAN_THEME_BOOT -->
    <!-- GOSSLAN_SKELETON_CSS -->
  </head>
  <body>
    <!-- 主窗口首屏骨架：结构照抄真实布局（caption 38 + rail 64 + list 250 + 聊天区 + 输入条），
         让用户点开的一瞬间就认得这是 Gosslan 的哪一屏。
         由 src/entries/main.ts 在真实数据就绪后加 .boot-hide 淡出并移除；初始化异常时也有兜底定时器。 -->
    <div id="boot" aria-hidden="true">
      <div class="boot-win">
        <div class="boot-cap">
          <span class="boot-brand">
            <span class="brand-zh">相闻 · 正在启动…</span>
            <span class="brand-en">Gosslan · Starting…</span>
          </span>
        </div>
        <div class="boot-main">
          <div class="boot-rail">
            <div class="boot-ava"></div>
            <div class="boot-ico"></div>
            <div class="boot-ico"></div>
            <div class="boot-ico"></div>
            <div class="boot-ico"></div>
          </div>
          <div class="boot-list">
            <div class="boot-search"></div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
            <div class="boot-row">
              <div class="boot-ava"></div>
              <div class="boot-lines"><i></i><i></i></div>
            </div>
          </div>
          <div class="boot-chat">
            <div class="boot-head">
              <div class="boot-title-line"></div>
              <div class="boot-sub-line"></div>
            </div>
            <div class="boot-msgs">
              <div class="boot-bubble"></div>
              <div class="boot-bubble short"></div>
              <div class="boot-bubble right"></div>
              <div class="boot-bubble"></div>
              <div class="boot-bubble right short"></div>
            </div>
            <div class="boot-composer"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/entries/main.ts"></script>
  </body>
</html>
